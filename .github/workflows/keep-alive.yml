name: Keep Supabase awake

# Supabase free projects pause after ~7 days without API activity.
# Remove this workflow once the app has real traffic.
on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "${{ vars.VITE_SUPABASE_URL }}/rest/v1/notes?select=id&limit=0" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}"
